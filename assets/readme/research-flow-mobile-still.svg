<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">KESKİN — a proposed comparison</title>
  <desc id="flow-desc">A shared radar satellite image splits into two planned paths. The left path uses direct object detection as a baseline. The right path applies super-resolution before detection. Both detection outputs meet in an assessment of detection impact. Image quality provides a complementary evaluation lens. This diagram describes proposed research, not experimental results.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122438"/><stop offset="1" stop-color="#0c1b2b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1765f4"/><stop offset="1" stop-color="#78a9ff"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78a9ff" stop-opacity=".18"/><stop offset="1" stop-color="#78a9ff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9db3cb" stroke-opacity=".035" stroke-width="1"/></pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .label{fill:#eff5fb;font-size:24px;font-weight:600;letter-spacing:-.4px}
      .note{fill:#9db3cb;font-size:20px}
      .wire{fill:none;stroke:#35516f;stroke-width:2.5}
      .signal{fill:none;stroke:#78a9ff;stroke-width:3;stroke-linecap:round;stroke-dasharray:17 1000;stroke-dashoffset:17;animation:travel 7s linear infinite}
      .second{animation-delay:-2.8s}
      .third{animation-delay:-4.6s}
      @keyframes travel{0%{stroke-dashoffset:17;opacity:0}6%{opacity:.9}68%{opacity:.9}82%,100%{stroke-dashoffset:-510;opacity:0}}
      @media(prefers-reduced-motion:reduce){.signal{animation:none;display:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="758" rx="24" fill="#0c1b2b" stroke="#263c53"/>
  <rect x="2" y="2" width="596" height="756" rx="23" fill="url(#grid)"/>
  <path d="M32 34h24" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <text x="69" y="41" fill="#9db3cb" font-size="20" font-weight="600" letter-spacing="1.6">PROPOSED COMPARISON</text>
  <text x="300" y="70" class="note" text-anchor="middle">Same scene · two paths</text>

  <!-- One shared scene splits into direct and enhanced detection. -->
  <path class="wire" d="M300 180V202Q300 214 288 214H171Q159 214 159 226V250"/>
  <path class="wire" d="M300 180V202Q300 214 312 214H429Q441 214 441 226V250"/>
  <path class="wire" d="M441 378V416"/>
  <path class="wire" d="M159 378V550Q159 562 171 562H300V594"/>
  <path class="wire" d="M441 526V550Q441 562 429 562H300"/>
  <path class="signal" d="M300 180V202Q300 214 288 214H171Q159 214 159 226V250"/>
  <path class="signal second" d="M300 180V202Q300 214 312 214H429Q441 214 441 226V250"/>
  <path class="signal third" d="M441 378V416"/>
  <path class="signal second" d="M159 378V550Q159 562 171 562H300V594"/>
  <path class="signal third" d="M441 526V550Q441 562 429 562H300V594"/>
  <circle cx="300" cy="202" r="5" fill="#78a9ff" stroke="#0c1b2b" stroke-width="3"/>
  <circle cx="300" cy="562" r="5" fill="#78a9ff" stroke="#0c1b2b" stroke-width="3"/>

  <!-- Original vector pixel field: low-resolution radar input. -->
  <rect x="184" y="88" width="232" height="92" rx="16" fill="url(#surface)" stroke="#3b526b"/>
  <rect x="202" y="109" width="50" height="50" rx="7" fill="#203952"/>
  <path d="M206 119h10v10h-10zM228 112h10v10h-10zM217 130h10v10h-10zM239 133h9v10h-9zM206 144h10v10h-10zM228 144h10v10h-10z" fill="#9db3cb" opacity=".38"/>
  <path d="M217 119h10v10h-10zM228 130h10v10h-10zM217 141h10v10h-10z" fill="#cbdcf0" opacity=".82"/>
  <text x="267" y="127" class="label">SAR input</text>
  <text x="267" y="153" class="note">Shared scene</text>

  <!-- Left branch: the baseline uses direct detection. -->
  <rect x="46" y="250" width="226" height="128" rx="16" fill="url(#surface)" stroke="#3b526b"/>
  <g transform="translate(141 270)" fill="none" stroke="#9db3cb" stroke-width="2" stroke-linecap="round">
    <path d="M0 11V0h11M25 0h11v11M36 25v11H25M11 36H0V25"/>
    <rect x="10" y="11" width="16" height="14" rx="2" stroke-width="1.5" opacity=".6"/>
  </g>
  <text x="159" y="334" class="label" text-anchor="middle">Baseline</text>
  <text x="159" y="361" class="note" text-anchor="middle">Direct detection</text>

  <!-- Right branch: reconstruct detail, then detect objects. -->
  <rect x="328" y="250" width="226" height="128" rx="16" fill="url(#surface)" stroke="#416896"/>
  <rect x="329" y="251" width="224" height="126" rx="15" fill="url(#scan)"/>
  <g transform="translate(420 267)">
    <rect width="42" height="42" rx="7" fill="#1c3859" stroke="#78a9ff" stroke-opacity=".4"/>
    <path d="M7 11h10M27 9h8M5 30h10M25 34h11M30 19h7" stroke="#9db3cb" stroke-opacity=".45" stroke-width="2"/>
    <path d="m12 29 11-18 5 3-11 18Z" fill="#b5d1ff"/>
    <path d="m18 24 5-8 2 1-5 8Z" fill="#1765f4"/>
    <path d="M8 8V5h3M31 5h6v6M37 31v6h-6M11 37H5v-6" fill="none" stroke="#78a9ff" stroke-width="1.3"/>
  </g>
  <text x="441" y="334" class="label" text-anchor="middle">Super-resolution</text>
  <text x="441" y="361" class="note" text-anchor="middle">Reconstruct detail</text>

  <rect x="328" y="416" width="226" height="110" rx="16" fill="url(#surface)" stroke="#416896"/>
  <g transform="translate(348 452)" fill="none" stroke="#78a9ff" stroke-width="2" stroke-linecap="round">
    <path d="M0 11V0h11M25 0h11v11M36 25v11H25M11 36H0V25"/>
    <rect x="10" y="11" width="16" height="14" rx="2" stroke-width="1.5"/>
  </g>
  <text x="400" y="461" class="label">Detection</text>
  <text x="400" y="489" class="note">Enhanced input</text>

  <!-- Convergence denotes assessment, without suggesting a measured gain. -->
  <rect x="132" y="594" width="336" height="106" rx="16" fill="#142c47" stroke="#78a9ff" stroke-opacity=".65"/>
  <path d="M287 611h26" stroke="#78a9ff" stroke-width="2" stroke-linecap="round"/>
  <text x="300" y="645" class="label" text-anchor="middle">Detection impact</text>
  <text x="300" y="675" class="note" text-anchor="middle">Compare both paths</text>

  <path d="M32 719H568" stroke="#263c53"/>
  <text x="300" y="744" fill="#9db3cb" font-size="19" text-anchor="middle">Image quality + detection performance</text>
<style>*{animation:none!important}</style>
</svg>
