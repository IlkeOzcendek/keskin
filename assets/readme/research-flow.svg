<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">KESKİN — a proposed comparison</title>
  <desc id="flow-desc">The same radar satellite image follows two planned paths: direct object detection, and super-resolution followed by object detection. Both detection outputs are compared to study the effect of super-resolution. Image quality is a complementary evaluation lens. This is a proposed research design, not an experimental result.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122438"/><stop offset="1" stop-color="#0c1b2b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1765f4"/><stop offset="1" stop-color="#78a9ff"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78a9ff" stop-opacity=".18"/><stop offset="1" stop-color="#78a9ff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9db3cb" stroke-opacity=".035" stroke-width="1"/></pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .label{fill:#eff5fb;font-size:22px;font-weight:600;letter-spacing:-.4px}
      .note{fill:#9db3cb;font-size:16px}
      .wire{fill:none;stroke:#35516f;stroke-width:2}
      .signal{fill:none;stroke:#78a9ff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:15 1000;stroke-dashoffset:15;animation:travel 7s linear infinite}
      .second{animation-delay:-2.8s}
      .third{animation-delay:-4.6s}
      @keyframes travel{0%{stroke-dashoffset:15;opacity:0}6%{opacity:.9}68%{opacity:.9}82%,100%{stroke-dashoffset:-650;opacity:0}}
      @media(prefers-reduced-motion:reduce){.signal{animation:none;display:none}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="378" rx="24" fill="#0c1b2b" stroke="#263c53"/>
  <rect x="2" y="2" width="1196" height="376" rx="23" fill="url(#grid)"/>
  <path d="M44 48h24" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="54" fill="#9db3cb" font-size="16" font-weight="600" letter-spacing="2">PROPOSED COMPARISON</text>
  <text x="1156" y="54" fill="#9db3cb" font-size="16" text-anchor="end">Same scene · two paths</text>

  <!-- A shared input makes the comparison explicit. -->
  <path class="wire" d="M254 193H286Q298 193 298 181V133Q298 121 310 121H626"/>
  <path class="wire" d="M298 193V254Q298 266 310 266H338"/>
  <path class="wire" d="M600 266H626"/>
  <path class="wire" d="M836 121H885Q897 121 897 133V185Q897 197 909 197H946"/>
  <path class="wire" d="M836 266H885Q897 266 897 254V209Q897 197 909 197"/>
  <path class="signal" d="M254 193H286Q298 193 298 181V133Q298 121 310 121H626"/>
  <path class="signal second" d="M254 193H286Q298 193 298 205V254Q298 266 310 266H338"/>
  <path class="signal third" d="M600 266H626"/>
  <path class="signal second" d="M836 121H885Q897 121 897 133V185Q897 197 909 197H946"/>
  <path class="signal third" d="M836 266H885Q897 266 897 254V209Q897 197 909 197H946"/>
  <circle cx="298" cy="193" r="4" fill="#78a9ff" stroke="#0c1b2b" stroke-width="3"/>
  <text x="338" y="103" class="note">Without enhancement</text>

  <!-- Low-resolution SAR is represented by an original vector pixel field. -->
  <rect x="44" y="144" width="210" height="98" rx="16" fill="url(#surface)" stroke="#3b526b"/>
  <rect x="60" y="167" width="50" height="50" rx="7" fill="#203952"/>
  <path d="M64 177h10v10H64zM86 170h10v10H86zM75 188h10v10H75zM97 191h9v10h-9zM64 202h10v10H64zM86 202h10v10H86z" fill="#9db3cb" opacity=".38"/>
  <path d="M75 177h10v10H75zM86 188h10v10H86zM75 199h10v10H75z" fill="#cbdcf0" opacity=".82"/>
  <text x="124" y="187" class="label">SAR input</text>
  <text x="124" y="213" class="note">Shared scene</text>

  <!-- Baseline detector. -->
  <rect x="626" y="79" width="210" height="84" rx="16" fill="url(#surface)" stroke="#3b526b"/>
  <g transform="translate(645 102)" fill="none" stroke="#9db3cb" stroke-width="2" stroke-linecap="round">
    <path d="M0 11V0h11M25 0h11v11M36 25v11H25M11 36H0V25"/>
    <rect x="10" y="11" width="16" height="14" rx="2" stroke-width="1.5" opacity=".6"/>
  </g>
  <text x="698" y="117" class="label">Baseline</text>
  <text x="698" y="142" class="note">Direct detection</text>

  <!-- Proposed super-resolution branch. -->
  <rect x="338" y="224" width="262" height="84" rx="16" fill="url(#surface)" stroke="#416896"/>
  <rect x="339" y="225" width="260" height="82" rx="15" fill="url(#scan)"/>
  <g transform="translate(356 244)">
    <rect width="42" height="42" rx="7" fill="#1c3859" stroke="#78a9ff" stroke-opacity=".4"/>
    <path d="M7 11h10M27 9h8M5 30h10M25 34h11M30 19h7" stroke="#9db3cb" stroke-opacity=".45" stroke-width="2"/>
    <path d="m12 29 11-18 5 3-11 18Z" fill="#b5d1ff"/>
    <path d="m18 24 5-8 2 1-5 8Z" fill="#1765f4"/>
    <path d="M8 8V5h3M31 5h6v6M37 31v6h-6M11 37H5v-6" fill="none" stroke="#78a9ff" stroke-width="1.3"/>
  </g>
  <text x="412" y="260" class="label">Super-resolution</text>
  <text x="412" y="286" class="note">Reconstruct detail</text>

  <rect x="626" y="224" width="210" height="84" rx="16" fill="url(#surface)" stroke="#416896"/>
  <g transform="translate(645 247)" fill="none" stroke="#78a9ff" stroke-width="2" stroke-linecap="round">
    <path d="M0 11V0h11M25 0h11v11M36 25v11H25M11 36H0V25"/>
    <rect x="10" y="11" width="16" height="14" rx="2" stroke-width="1.5"/>
  </g>
  <text x="698" y="262" class="label">Detection</text>
  <text x="698" y="287" class="note">Enhanced input</text>

  <!-- Both detection outputs converge on an assessment, not a claimed win. -->
  <rect x="946" y="143" width="210" height="108" rx="16" fill="#142c47" stroke="#78a9ff" stroke-opacity=".65"/>
  <path d="M964 160h18" stroke="#78a9ff" stroke-width="2" stroke-linecap="round"/>
  <text x="966" y="197" class="label">Detection impact</text>
  <text x="966" y="224" class="note">Compare both paths</text>

  <path d="M44 339H1156" stroke="#263c53"/>
  <text x="44" y="365" class="note">Evaluation lenses</text>
  <circle cx="221" cy="359" r="3" fill="#78a9ff"/>
  <text x="234" y="365" fill="#d4e3f4" font-size="16">Image quality</text>
  <circle cx="366" cy="359" r="3" fill="#78a9ff"/>
  <text x="379" y="365" fill="#d4e3f4" font-size="16">Detection performance</text>
  <text x="1156" y="365" fill="#9db3cb" font-size="16" text-anchor="end">KESKİN / Research design</text>
</svg>
